<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Next in Dhaka</title><meta name="description" content="Next in Dhaka: events and stories from across Dhaka (prototype with fictional sample content).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"></head>
<body data-page="contact"><header id="site-header"></header>
<main class="wrap sec narrow"><h1>Contact us</h1><p class="lead">Organizers, advertisers and readers: send us a note. The button opens your email app with the message ready to send.</p>
<form id="cf" class="f" style="margin-top:1.5rem">
<label>I want to<select id="topic"><option value="event">Submit an event</option><option value="advertise">Advertise</option><option value="general">Say hello</option></select></label>
<label>Your name<input id="cn" required></label><label>Your email<input id="ce" type="email" required></label>
<label>Message<textarea id="msg" rows="5" required></textarea></label><button class="btn">Open email to send</button></form></main>
<footer id="site-footer"></footer><script src="js/data.js"></script><script src="js/main.js"></script></body></html>
