<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next in Dhaka | Events and Stories</title><meta name="description" content="Next in Dhaka: events and stories from across Dhaka (prototype with fictional sample content).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"></head>
<body data-page="home"><header id="site-header"></header>
<main>
<section class="hero"><div class="wrap"><h1>What’s next in Dhaka</h1><p class="lead">Concerts, expos, exhibitions, launches and festivals. Find something to do this week, or put your own event in front of the city.</p>
<div class="cta"><a class="btn" href="#events">Browse events</a><a class="btn alt" href="contact.html?topic=event">Submit your event</a></div></div></section>
<section class="wrap sec"><h2>Featured events</h2><div id="featured" class="grid"></div></section>
<section class="wrap sec" id="events"><div class="head"><h2>Upcoming events</h2><span id="count" class="meta"></span></div>
<input id="q" type="search" placeholder="Search by event, venue or area" aria-label="Search events"><div id="chips" class="chips"></div><div id="upcoming" class="grid"></div></section>
<section class="wrap sec" id="stories"><h2>Latest stories</h2><div id="storyGrid" class="grid"></div></section>
<section class="wrap sec"><h2>Popular categories</h2><div id="cats" class="grid cats"></div></section>
<section class="band"><div class="wrap"><h2>Get Dhaka’s week in your inbox</h2><form id="news"><input type="email" required placeholder="Your email address" aria-label="Email address"><button class="btn">Subscribe</button></form><p id="newsMsg" role="status" style="margin-top:.8rem"></p></div></section>
</main>
<footer id="site-footer"></footer><script src="js/data.js"></script><script src="js/main.js"></script></body></html>
